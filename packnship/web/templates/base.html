<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pack-N-Ship{% endblock %}</title>
    <!-- Tailwind CSS (CDN for rapid UI development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{% static 'images/appiconfinal.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/appiconfinal.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/appiconfinal.png' %}">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    
    <!-- Navigation will go here later -->
    <nav class="bg-blue-600 p-4 text-white shadow-md">
        <div class="container mx-auto">
            <h1 class="text-xl font-bold">Pack-N-Ship</h1>
        </div>
    </nav>

    <!-- Main content area for our specific pages -->
    <main class="container mx-auto p-4 min-h-screen">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer will go here later -->
    <footer class="bg-gray-800 text-white p-4 text-center mt-8">
        <p>&copy; 2026 Pack-N-Ship Logistics</p>
    </footer>

</body>
</html>
