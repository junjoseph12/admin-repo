{% load static %}
<header class="shell-header h-16 flex items-center justify-between px-6 z-10 shrink-0">

    {# Left: contextual page area (empty by design; pages can extend later) #}
    <div class="flex items-center gap-3 min-w-0">
        <a href="{% url 'admin_support' %}" target="_blank" rel="noopener"
           class="header-action relative" title="Open Support Chat">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            <span class="text-xs font-bold tracking-wide">Support</span>
            <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full border border-white" aria-hidden="true">
                <span class="absolute inset-0 rounded-full bg-red-500 animate-ping opacity-75"></span>
            </span>
        </a>
    </div>

    {# Right: theme, logs, profile #}
    <div class="flex items-center gap-2">
        <button id="themeToggle" type="button" class="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>

        <a href="{% url 'admin_logs' %}" class="header-action" title="View Admin Logs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-xs font-bold tracking-wide">Logs</span>
        </a>

        <div class="w-px h-6 mx-1" style="background: var(--border-strong);" aria-hidden="true"></div>

        <div class="relative" id="profileDropdownWrap">
            <button type="button" class="profile-trigger group" onclick="toggleProfileMenu(event)" aria-haspopup="true" aria-expanded="false" aria-controls="profileDropdownMenu">
                <div class="relative">
                    <div class="avatar-shell">
                        <svg class="w-5 h-5 text-white/95" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <span class="status-dot" aria-hidden="true"></span>
                </div>
                <div class="hidden sm:flex flex-col text-left">
                    <span class="text-[13px] font-bold" style="color: var(--text-primary);">{{ request.user.first_name|default:"Administrator" }}</span>
                    <span class="text-[10px] font-bold uppercase tracking-wide" style="color: var(--text-muted);">System Admin</span>
                </div>
                <svg class="w-4 h-4 hidden sm:block transition-transform duration-300 group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-muted);">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>

            <div id="profileDropdownMenu" class="hidden absolute right-0 mt-2 w-56 rounded-xl shadow-xl overflow-hidden z-50 anim-slide-down" style="background: var(--bg-elevated); border: 1px solid var(--border-subtle);" role="menu">
                <div class="px-4 py-3" style="border-bottom: 1px solid var(--border-subtle); background: var(--bg-surface-muted);">
                    <p class="text-sm font-bold" style="color: var(--text-primary);">{{ request.user.first_name|default:"Administrator" }}</p>
                    <p class="text-xs font-medium truncate" style="color: var(--text-muted);">{{ request.user.email|default:"admin@packnship.com" }}</p>
                </div>
                <div class="p-2">
                    <form method="post" action="{% url 'logout' %}" onsubmit="return confirm('Are you sure you want to log out of Pack-N-Ship?');">
                        {% csrf_token %}
                        <button type="submit" class="logout-btn" role="menuitem">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
    function toggleProfileMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById('profileDropdownMenu');
        const trigger = e.currentTarget;
        const isOpen = !menu.classList.contains('hidden');
        menu.classList.toggle('hidden');
        trigger.setAttribute('aria-expanded', String(!isOpen));
    }
    document.addEventListener('click', (e) => {
        const wrap = document.getElementById('profileDropdownWrap');
        const menu = document.getElementById('profileDropdownMenu');
        if (!wrap || !menu) return;
        if (!wrap.contains(e.target)) {
            menu.classList.add('hidden');
            const t = wrap.querySelector('.profile-trigger');
            if (t) t.setAttribute('aria-expanded', 'false');
        }
    });
</script>
